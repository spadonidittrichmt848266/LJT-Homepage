name: Temporary site build check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: ruby/setup-ruby@v1.328.0
        with:
          ruby-version: '3.1'
          bundler-cache: true
          cache-version: 0
      - name: Install UglifyJS
        run: npm install -g uglify-js
      - name: Minify JS files
        run: uglifyjs assets/js/plugins/jquery.greedy-navigation.js assets/js/_main.js assets/js/theme.js -c -m -o assets/js/main.min.js
      - name: Build with Jekyll
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production
      - name: Verify site content and internal links
        run: |
          python - <<'PY'
          import html.parser
          import pathlib
          import re
          import urllib.parse

          root = pathlib.Path('_site')
          base = 'https://spadonidittrichmt848266.github.io/LJT-Homepage'

          class Links(html.parser.HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.hrefs = []
              def handle_starttag(self, tag, attrs):
                  for key, value in attrs:
                      if key == 'href' and value:
                          self.hrefs.append(value)

          missing = []
          for page in sorted(root.rglob('*.html')):
              parser = Links()
              parser.feed(page.read_text())
              for href in parser.hrefs:
                  if href.startswith(('mailto:', '#', 'tel:')):
                      continue
                  if href.startswith('http'):
                      if not href.startswith(base):
                          continue
                      path = urllib.parse.urlparse(href).path
                  else:
                      path = href.split('#')[0]
                  if not path or path == '/':
                      continue
                  path = path.replace('/LJT-Homepage', '', 1)
                  target = root / path.lstrip('/')
                  if not target.exists() and not (target / 'index.html').exists():
                      missing.append((str(page), href))
          print('Missing internal links:', missing)

          about = (root / 'index.html').read_text()
          pubs = (root / 'publications' / 'index.html').read_text()
          titles = re.findall(r'<a href="[^"]*" rel="permalink">([^<]+)</a>', pubs)
          print('Publication order:', titles)
          assert len(titles) == 6, 'Expected six publications'
          for title in titles:
              assert title in about, 'Publication missing from About page: ' + title

          combined = '\n'.join(p.read_text() for p in root.rglob('*.html'))
          for placeholder in ['Your Name', 'Paper Title Number', 'GitHub University', 'Red Brick University', 'none@example.org', 'blog-post-', 'portfolio item number']:
              assert placeholder not in combined, 'Template placeholder found: ' + placeholder

          print('SynLogic detail page:')
          detail = (root / 'publication' / 'synlogic' / 'index.html').read_text()
          body = detail.split('<div class="archive">')[1].split('<div class="page__footer">')[0]
          print(body)
          assert not missing, 'Broken internal links'
          print('All content and link checks passed.')
          PY
